<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Capelo (chapéu de formatura) — marca do GestEscolar.
       O index.html já apontava para /favicon.svg, mas o arquivo não existia:
       a aba ficava com o ícone genérico do navegador. -->
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2F6BF0"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2F6BF0"/>
      <stop offset="100%" stop-color="#16307E"/>
    </linearGradient>
  </defs>

  <!-- Corpo do capelo sob a aba -->
  <path d="M18 30.5v9.8c0 1.2.6 2.3 1.7 3 3.3 2.1 7.7 3.2 12.3 3.2s9-1.1 12.3-3.2c1.1-.7 1.7-1.8 1.7-3v-9.8L32 36.4 18 30.5Z"
        fill="url(#base)"/>

  <!-- Aba superior (losango) -->
  <path d="M32 12.5 60 24 32 35.5 4 24 32 12.5Z" fill="url(#cap)"/>

  <!-- Borla: cordão + pingente -->
  <path d="M56 26.4v11.2" stroke="#F2B233" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="56" cy="41.4" r="3.6" fill="#F2B233"/>
</svg>
